<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
    <title>Crm for pet-projects</title>
</head>

<body>


    <div class="app-content">
        <div class="raw-ideas-container">
            <div class="headings-container">
                <img src="./assets/lamp-icon.png" alt="lamp-icon" class="raw-ideas-icon">
                <h1 class="raw-ideas-heading">Сырая идея</h1>
                <h1 class="raw-ideas-counter">4</h1>
            </div>
            <div class="idea-container">
                <h1 class="idea-heading">Трекер Привычек</h1>
                <p class="idea-description">Простое приложение для формирования полезных привычек.</p>
                <p class="idea-tag">Мобильное приложение</p>
            </div>
            <button class="add-raw-idea">
                <div class="button-container">
                    + Добавить идею
                </div>
            </button>
        </div>

    </div>
    <div class="new-idea-container">
        <h1 class="idea-name">НОВАЯ ИДЕЯ</h1>
        <div class="new-idea-inputs-container">
            <p>НАЗВАНИЕ:</p>
            <input type="text" placeholder="Приложение для...">
            <p>ОПИСАНИЕ:</p>
            <input type="text" placeholder="Идея состоит в...">
        </div>
        <div class="new-idea-tags-container">
            <p>Тег</p>
            <button class="choose-tag">Выбрать тег</button>
        </div>
        <div class="new-idea-buttons-container">
            <button class="reject-idea-button">ОТМЕНА</button>
            <button class="save-idea-button">СОХРАНИТЬ</button>
        </div>

    </div>
    <div class="choose-tag-container">
        <p class="idea-tag-option-mobile-app">Мобильное<br>приложение</p>
        <p class="idea-tag-option-telegram-bot">Telegram Bot</p>
        <p class="idea-tag-option-web-servise">Веб - сервис</p>
        <p class="idea-tag-option-idea">Идея</p>
        <p class="idea-tag-option-back">X</p>
    </div>
</body>

</html>
